<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A24B"/>
      <stop offset="100%" style="stop-color:#a8873a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <text x="400" y="280" font-family="Georgia, serif" font-size="120" font-weight="bold" fill="#0B1F3A" text-anchor="middle" opacity="0.9">CL</text>
  <text x="400" y="380" font-family="Inter, sans-serif" font-size="28" fill="rgba(255,255,255,0.7)" text-anchor="middle">Coal</text>
  <rect x="20" y="20" width="760" height="560" rx="8" fill="none" stroke="#0B1F3A" stroke-width="2" opacity="0.3"/>
